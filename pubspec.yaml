name: intubation_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  # Updated for Flutter 3.41.9 (Dart 3.11.5)
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.2.2
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: 12.0.2
  url_launcher: ^6.3.2
  record: ^6.2.0
  audioplayers: ^6.6.0
  crypto: ^3.0.7
  intl: ^0.20.2
  http: ^1.6.0
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  file_picker: ^8.0.3
  permission_handler: ^12.0.1
  google_generative_ai: ^0.4.7
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  mini_music_visualizer: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/1.png
    - assets/2.png
    - assets/3.png
    - assets/4.png

  # Uncomment and adjust if your project uses assets:
  # assets:
  #   - assets/